<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>TP JavaScript</title>
</head>

<body>
    <h1>Exercice X</h1>
    <h1> Calculatrice de cercle</h1>
    <div id="rayon"></div>
    <div id="perimetre"></div>
    <div id="surface"></div>

    <script>
        const PI = Math.PI;
        let rayonCercle = prompt("Veuillez entrer le rayon d'un cercle !");
        rayonCercle = Number(rayonCercle);
        let perimetreCercle = 2 * PI * rayonCercle;
        let surfaceCercle = PI * rayonCercle * rayonCercle;
        document.getElementById("rayon").innerHTML = `${rayonCercle} cm`;
        document.getElementById("perimetre").innerHTML = `${perimetreCercle.toFixed(2)} cm`;
        document.getElementById("surface").innerHTML = `${surfaceCercle.toFixed(2)} cm²`;
    </script>
</body>

</html>
